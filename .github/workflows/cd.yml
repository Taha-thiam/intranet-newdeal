name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  security-scan:
    name: Job 1 - Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  deploy:
    name: Job 2 - Deploy on runner_prod
    runs-on: runner_prod
    needs: security-scan
    steps:
      - name: Pull and run container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest
          docker stop intranet || true
          docker rm intranet || true
          docker run -d --name intranet -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest