name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  security-scan:
    name: Job 1 - Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scan with Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  deploy:
    name: Job 2 - Deploy on runner_prod
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and run container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest
          docker stop intranet || true
          docker rm intranet || true
          docker run -d --name intranet -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest